<script>
const API_KEY = "AIzaSyBgcpIpT0VhfdGO8Q5bF3KE_3-58BkH2F4";
const PLAYLIST_ID = "PL5ugFQ27GsimiJ22c3AkXXMIP0Ac-EWKO";

async function loadPlaylist() {
  const container = document.getElementById("collab-videos");

  try {
    const params = new URLSearchParams({
      part: "snippet",
      playlistId: PLAYLIST_ID,
      maxResults: "50",
      key: API_KEY
    });

    const response = await fetch(
      "https://www.googleapis.com/youtube/v3/playlistItems?" + params
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "取得に失敗しました");
    }

    const videos = data.items || [];
    const INITIAL_COUNT = 4;
    let showingAll = false;

    function renderVideos() {
      container.replaceChildren();

      const visibleVideos = showingAll
        ? videos
        : videos.slice(0, INITIAL_COUNT);

      visibleVideos.forEach(item => {
        const snippet = item.snippet;
        const videoId = snippet?.resourceId?.videoId;
        if (!videoId) return;

        const card = document.createElement("a");
        card.className = "youtube-video-card";
        card.href = "https://www.youtube.com/watch?v=" + videoId;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        const image = document.createElement("img");
        image.src = snippet.thumbnails?.high?.url ||
                    snippet.thumbnails?.medium?.url || "";
        image.alt = "";

        const title = document.createElement("div");
        title.className = "youtube-video-title";
        title.textContent = snippet.title;

        card.append(image, title);
        container.appendChild(card);
      });

      if (videos.length > INITIAL_COUNT) {
        const button = document.createElement("button");
        button.className = "youtube-more-button";
        button.textContent = showingAll ? "閉じる ▲" : "もっと見る ▼";

        button.onclick = () => {
          showingAll = !showingAll;
          renderVideos();
        };

        container.appendChild(button);
      }
    }

    renderVideos();

  } catch (error) {
    console.error(error);
    container.textContent = "動画を読み込めませんでした。";
  }
}

loadPlaylist();
</script>
